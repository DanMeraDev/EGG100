name: Solicitud de cambio
description: Cambio aprobado tras una evaluación (plantilla SRS-135)
labels: ["cambio"]
body:
  - type: input
    id: id_cambio
    attributes:
      label: ID del cambio
      placeholder: "CC-01"
    validations:
      required: true
  - type: dropdown
    id: version
    attributes:
      label: Versión de origen
      options: ["V1", "V2", "V3"]
    validations:
      required: true
  - type: input
    id: observacion
    attributes:
      label: Observación que lo origina
      placeholder: "#12"
    validations:
      required: true
  - type: input
    id: requisitos
    attributes:
      label: Requisito(s) afectado(s)
    validations:
      required: true
  - type: textarea
    id: analisis
    attributes:
      label: Análisis
  - type: textarea
    id: decision
    attributes:
      label: Decisión
    validations:
      required: true
  - type: input
    id: prueba
    attributes:
      label: Prueba asociada
      placeholder: "CP-19"
